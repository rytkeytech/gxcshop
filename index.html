<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENX CHOICE ENTERPRISE — Choice for Every Generation</title>
<meta name="description" content="Phones, appliances, electronics &amp; more — browse and order on WhatsApp.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ============================================================
  GENX CHOICE ENTERPRISE — WhatsApp Shop
  Products come from products.json (same folder). Use admin.html
  to build your categories and products with photos — no coding.
============================================================= -->

<style>
  :root{
    --navy: #0F1D36;
    --navy-soft: #17294a;
    --gold: #B8862E;
    --gold-soft: #D8A84E;
    --bg: #F7F6F3;
    --card: #FFFFFF;
    --ink: #171B26;
    --slate: #626A78;
    --line: #E8E6E0;
    --price: #C24A1F;
    --radius: 16px;
    --shadow: 0 2px 8px rgba(15,29,54,0.05), 0 10px 24px rgba(15,29,54,0.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:88px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Manrope',system-ui,sans-serif;
    margin:0;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Header ---------- */
  header.site{
    background:var(--navy);
    color:#fff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:30;
    box-shadow:0 1px 0 rgba(255,255,255,0.06);
  }
  header.site img.logo{
    width:36px;height:36px;object-fit:contain;
    background:#fff;
    border-radius:9px;
    padding:4px;
  }
  header.site .brand{flex:1;min-width:0;}
  header.site .brand h1{color:#fff;font-size:16px;font-weight:800;letter-spacing:0;line-height:1.2;}
  header.site .brand span{display:block;font-size:10.5px;color:var(--gold-soft);margin-top:2px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.site .cart-btn{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-weight:700;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:7px;
    position:relative;
    box-shadow:0 2px 6px rgba(184,134,46,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  header.site .cart-btn:active{
    transform:scale(0.96);
    box-shadow:0 1px 3px rgba(184,134,46,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .cart-count{
    background:rgba(0,0,0,0.22);
    color:#fff;
    border-radius:999px;
    font-size:11px;
    min-width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
  }

  /* ---------- Search (compact, search-first) ---------- */
  .search-wrap{
    max-width:960px;
    margin:0 auto;
    padding:14px 16px 4px;
  }
  .search-box{
    background:var(--card);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:11px 15px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
  }
  .search-box input{
    border:none;outline:none;flex:1;font-size:15px;background:transparent;color:var(--ink);font-family:'Inter',sans-serif;
  }

  /* ---------- Category icon row ---------- */
  .cat-icons{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px 12px 12px;
    max-width:960px;
    margin:0 auto;
    scrollbar-width:none;
  }
  .cat-icons::-webkit-scrollbar{display:none;}
  .cat-icon-btn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    width:64px;
  }
  .cat-icon-circle{
    width:46px;height:46px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(15,29,54,0.06);
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s ease;
  }
  .cat-icon-btn:active .cat-icon-circle{transform:scale(0.92);}
  .cat-icon-btn.active .cat-icon-circle{
    background:var(--navy);
    border-color:var(--navy);
    box-shadow:0 3px 8px rgba(15,29,54,0.28);
  }
  .cat-icon-btn.active .cat-icon-circle span{filter:brightness(0) invert(1);}
  .cat-icon-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--slate);
    text-align:center;
    line-height:1.2;
    font-family:'Manrope',sans-serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:64px;
  }
  .cat-icon-btn.active .cat-icon-label{color:var(--navy);}

  /* ---------- Product grid ---------- */
  main{max-width:960px;margin:0 auto;padding:4px 12px 8px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--card);
    border-radius:12px;
    box-shadow:0 1px 3px rgba(15,29,54,0.06);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    border:1px solid var(--line);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,29,54,0.1);}
  .card .thumb{
    aspect-ratio:1/1;
    background:#EFEDE7;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .thumb .ph{color:#a8a397;font-size:11.5px;font-weight:600;}
  .out-badge{
    position:absolute;top:7px;right:7px;
    background:rgba(23,27,38,0.88);color:#fff;
    font-size:9.5px;font-weight:700;
    padding:3px 8px;border-radius:6px;
    letter-spacing:.03em;
  }
  .card .body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
  .card .cat{font-size:9.5px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .card .name{font-size:12.5px;font-weight:600;line-height:1.3;color:var(--ink);}
  .card .price{
    color:var(--price);font-weight:800;font-size:16.5px;margin-top:2px;
    font-family:'Manrope',sans-serif;letter-spacing:-0.01em;
  }
  .card .add-row{display:flex;align-items:center;gap:8px;margin-top:5px;}
  .qty-stepper{
    display:flex;align-items:center;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    flex:1;
    background:var(--card);
    box-shadow:inset 0 1px 2px rgba(15,29,54,0.04);
  }
  .qty-stepper button{
    background:var(--bg);border:none;width:30px;height:32px;
    font-size:16px;color:var(--navy);font-weight:700;
    transition:background .12s ease, transform .1s ease;
  }
  .qty-stepper button:active{background:var(--line);transform:scale(0.9);}
  .qty-stepper span{flex:1;text-align:center;font-size:13px;font-weight:700;}
  .add-btn{
    background:linear-gradient(180deg, var(--navy-soft), var(--navy));
    color:#fff;border:none;border-radius:9px;
    padding:10px 10px;font-size:12.5px;font-weight:700;width:100%;
    font-family:'Manrope',sans-serif;
    box-shadow:0 2px 5px rgba(15,29,54,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .add-btn:active:not(:disabled){
    transform:scale(0.97);
    box-shadow:0 1px 2px rgba(15,29,54,0.18);
  }
  .add-btn:disabled{background:#c7c9d1;cursor:not-allowed;box-shadow:none;}

  .empty-state, .loading-state{
    text-align:center;padding:60px 20px;color:var(--slate);
  }
  .empty-state .big{font-size:32px;margin-bottom:8px;}
  .empty-state a{color:var(--navy);font-weight:700;text-decoration:underline;}

  /* ---------- Sticky cart bar ---------- */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--navy);
    color:#fff;
    padding:13px 18px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:40;
    box-shadow:0 -4px 20px rgba(0,0,0,0.18);
  }
  .cart-bar.show{display:flex;}
  .cart-bar .info{font-size:12px;color:#c6cbdb;}
  .cart-bar .info b{display:block;font-size:16px;font-family:'Manrope',sans-serif;color:#fff;font-weight:800;}
  .cart-bar button{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#fff;
    border:none;border-radius:9px;
    padding:11px 20px;font-weight:700;font-size:13.5px;
    font-family:'Manrope',sans-serif;
    box-shadow:0 2px 8px rgba(184,134,46,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cart-bar button:active{
    transform:scale(0.96);
    box-shadow:0 1px 3px rgba(184,134,46,0.35);
  }

  /* ---------- Drawer / Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,29,54,0.55);
    z-index:50;display:none;
  }
  .overlay.show{display:block;}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;
    width:min(420px,100%);
    background:var(--bg);
    z-index:60;
    transform:translateX(100%);
    transition:transform .28s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    background:var(--navy);color:#fff;
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-head h3{color:#fff;font-size:16px;font-weight:800;}
  .drawer-head button{
    background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:20px;line-height:1;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .12s ease, transform .1s ease;
  }
  .drawer-head button:active{background:rgba(255,255,255,0.2);transform:scale(0.92);}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 18px;}
  .cart-item{
    display:flex;gap:11px;background:var(--card);border-radius:12px;
    padding:11px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .cart-item img{width:58px;height:58px;object-fit:cover;border-radius:9px;background:#EFEDE7;flex:0 0 auto;}
  .cart-item .ci-info{flex:1;min-width:0;}
  .cart-item .ci-name{font-size:13.5px;font-weight:700;font-family:'Manrope',sans-serif;}
  .cart-item .ci-price{font-size:12px;color:var(--slate);margin-top:2px;}
  .cart-item .ci-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;}
  .remove-link{
    font-size:12px;color:#9a2f2f;font-weight:600;background:none;border:none;padding:2px 4px;
    border-radius:5px;transition:background .12s ease;
  }
  .remove-link:active{background:rgba(154,47,47,0.1);}

  .drawer-foot{
    border-top:1px solid var(--line);
    padding:16px 18px 22px;
    background:var(--bg);
  }
  .total-row{display:flex;justify-content:space-between;font-size:15.5px;font-weight:800;color:var(--navy);margin-bottom:14px;font-family:'Manrope',sans-serif;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .whatsapp-btn{
    width:100%;
    background:linear-gradient(180deg, #29DB6F, #1EBE5A);
    color:#fff;border:none;border-radius:12px;
    padding:15px;font-weight:800;font-size:15px;display:flex;align-items:center;
    justify-content:center;gap:8px;margin-top:8px;font-family:'Manrope',sans-serif;
    box-shadow:0 3px 10px rgba(30,190,90,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .whatsapp-btn:active:not(:disabled){
    transform:scale(0.98);
    box-shadow:0 1px 4px rgba(30,190,90,0.35);
  }
  .whatsapp-btn:disabled{background:#a9d9bf;box-shadow:none;}
  .hint{font-size:11.5px;color:var(--slate);margin-top:10px;text-align:center;}

  footer{text-align:center;padding:30px 16px 12px;color:var(--slate);font-size:12px;}
  footer .foot-brand{font-family:'Manrope',sans-serif;font-weight:800;color:var(--navy);font-size:12.5px;}
  footer .foot-slogan{font-style:italic;color:var(--gold);margin-top:2px;}

  #loadMoreBtn{
    background:linear-gradient(180deg, var(--navy-soft), var(--navy));
    color:#fff;border:none;border-radius:10px;padding:12px 26px;font-weight:700;font-size:13.5px;
    font-family:'Manrope',sans-serif;
    box-shadow:0 2px 8px rgba(15,29,54,0.22), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #loadMoreBtn:active{transform:scale(0.97);box-shadow:0 1px 3px rgba(15,29,54,0.2);}
</style>
</head>
<body>

<header class="site">
  <img src="logo.png" alt="GENX CHOICE ENTERPRISE" class="logo">
  <div class="brand">
    <h1>GENX CHOICE ENTERPRISE</h1>
    <span>CHOICE FOR EVERY GENERATION</span>
  </div>
  <button class="cart-btn" id="openCartTop">
    Cart <span class="cart-count" id="cartCountTop">0</span>
  </button>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search products…">
  </div>
</div>

<div class="cat-icons" id="categoryRow"></div>

<main>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;"></div>
  <div id="loadingState" class="loading-state">Loading products…</div>
  <div id="loadMoreWrap" style="display:none;text-align:center;padding:22px 0 6px;">
    <button id="loadMoreBtn">
      Show <span id="loadMoreCount"></span> more
    </button>
  </div>
</main>

<footer>
  <div class="foot-brand">GENX CHOICE ENTERPRISE</div>
  <div class="foot-slogan">Choice for every generation.</div>
</footer>

<!-- Sticky bottom cart bar -->
<div class="cart-bar" id="cartBar">
  <div class="info">Total <b id="cartBarTotal">GH₵0.00</b></div>
  <button id="openCartBottom">View Cart (<span id="cartCountBottom">0</span>)</button>
</div>

<!-- Cart drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Your Order</h3>
    <button id="closeDrawer">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="drawerTotal">GH₵0.00</span></div>
    <div class="field">
      <label for="custName">Your name</label>
      <input type="text" id="custName" placeholder="e.g. Kwame Mensah">
    </div>
    <div class="field">
      <label for="custLocation">Delivery / pickup location</label>
      <textarea id="custLocation" placeholder="e.g. Kumasi, Asokwa near the roundabout"></textarea>
    </div>
    <button class="whatsapp-btn" id="sendWhatsapp">📩 Order on WhatsApp</button>
    <div class="hint">Opens WhatsApp with your order filled in — just hit send.</div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
============================================================= */
const WHATSAPP_NUMBER = "233549572669"; // international format, no + or spaces
const DATA_URL = "products.json"; // built with admin.html

/* ============================================================
   State
============================================================= */
let PRODUCTS = [];
let CATEGORIES = [];
let cart = {};
let activeCategory = "All";
let searchTerm = "";
const PAGE_SIZE = 24;
let visibleCount = PAGE_SIZE;

/* ============================================================
   Load catalogue
============================================================= */
async function loadProducts(){
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    const json = await res.json();
    PRODUCTS = Array.isArray(json.products) ? json.products : [];
    CATEGORIES = Array.isArray(json.categories) ? json.categories : [];
  }catch(e){
    console.error("Could not load products.json", e);
    PRODUCTS = [];
    CATEGORIES = [];
  }
  document.getElementById("loadingState").style.display = "none";
  renderAll();
}

/* ============================================================
   Rendering
============================================================= */
function money(n){ return "GH₵" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }

function categoryIcon(name){
  const n = name.toLowerCase();
  if(n === "all") return "🗂️";
  if(/phone|mobile|tablet/.test(n)) return "📱";
  if(/appliance|kitchen|blender|kettle|cooker|fridge|fan|iron/.test(n)) return "🏠";
  if(/audio|speaker|sound|music|headphone|earbud/.test(n)) return "🎧";
  if(/perfume|fragrance|cosmetic|beauty/.test(n)) return "🌸";
  if(/charger|cable|power|battery/.test(n)) return "🔌";
  if(/case|cover|protector|screen/.test(n)) return "📦";
  if(/repair|service/.test(n)) return "🛠️";
  if(/tv|television|monitor/.test(n)) return "📺";
  if(/laptop|computer|pc/.test(n)) return "💻";
  if(/watch|wearable/.test(n)) return "⌚";
  if(/shoe|cloth|fashion|bag/.test(n)) return "👜";
  return "🛍️";
}

function renderCategories(){
  const cats = ["All", ...CATEGORIES];
  const row = document.getElementById("categoryRow");
  row.innerHTML = cats.map(c => `
    <button class="cat-icon-btn ${c===activeCategory?'active':''}" data-cat="${c}">
      <span class="cat-icon-circle"><span>${categoryIcon(c)}</span></span>
      <span class="cat-icon-label">${c}</span>
    </button>
  `).join("");
  row.querySelectorAll(".cat-icon-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      visibleCount = PAGE_SIZE;
      renderCategories();
      renderGrid();
    });
  });
}

function getFiltered(){
  return PRODUCTS.filter(p => {
    const matchesCat = activeCategory === "All" || p.category === activeCategory;
    const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesCat && matchesSearch;
  });
}

function renderGrid(){
  const filtered = getFiltered();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  const loadMoreWrap = document.getElementById("loadMoreWrap");

  if(!PRODUCTS.length){
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.innerHTML = `<div class="big">🛍️</div>No products yet — the shop owner is still setting up the catalogue.`;
    loadMoreWrap.style.display = "none";
    return;
  }
  if(!filtered.length){
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.innerHTML = `<div class="big">🔍</div>No products match your search.`;
    loadMoreWrap.style.display = "none";
    return;
  }
  empty.style.display = "none";
  const pageItems = filtered.slice(0, visibleCount);
  grid.innerHTML = pageItems.map(p => {
    const inCart = cart[p.id];
    const qty = inCart ? inCart.qty : 0;
    const outOfStock = p.instock === "no";
    return `
    <div class="card">
      <div class="thumb">
        ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">` : `<span class="ph">No photo</span>`}
        ${outOfStock ? `<span class="out-badge">SOLD OUT</span>` : ""}
      </div>
      <div class="body">
        <div class="cat">${p.category}</div>
        <div class="name">${p.name}</div>
        <div class="price">${money(p.price)}</div>
        <div class="add-row">
          ${qty > 0 ? `
            <div class="qty-stepper">
              <button data-action="dec" data-id="${p.id}">−</button>
              <span>${qty}</span>
              <button data-action="inc" data-id="${p.id}">+</button>
            </div>
          ` : `
            <button class="add-btn" data-action="add" data-id="${p.id}" ${outOfStock ? "disabled" : ""}>
              ${outOfStock ? "Unavailable" : "Add to cart"}
            </button>
          `}
        </div>
      </div>
    </div>`;
  }).join("");

  grid.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      const product = PRODUCTS.find(p => p.id === id);
      const action = el.dataset.action;
      if(action === "add"){
        cart[id] = {product, qty:1};
      } else if(action === "inc"){
        cart[id].qty++;
      } else if(action === "dec"){
        cart[id].qty--;
        if(cart[id].qty <= 0) delete cart[id];
      }
      renderGrid();
      renderCartUI();
    });
  });

  if(filtered.length > visibleCount){
    loadMoreWrap.style.display = "block";
    document.getElementById("loadMoreCount").textContent = filtered.length - visibleCount;
  } else {
    loadMoreWrap.style.display = "none";
  }
}

function cartCount(){
  return Object.values(cart).reduce((sum,i) => sum + i.qty, 0);
}
function cartTotal(){
  return Object.values(cart).reduce((sum,i) => sum + i.qty * i.product.price, 0);
}

function renderCartUI(){
  const count = cartCount();
  const total = cartTotal();
  document.getElementById("cartCountTop").textContent = count;
  document.getElementById("cartCountBottom").textContent = count;
  document.getElementById("cartBarTotal").textContent = money(total);
  document.getElementById("drawerTotal").textContent = money(total);
  document.getElementById("cartBar").classList.toggle("show", count > 0);

  const body = document.getElementById("drawerBody");
  const items = Object.values(cart);
  if(!items.length){
    body.innerHTML = `<p style="color:var(--slate);text-align:center;padding:30px 10px;">Your cart is empty.</p>`;
  } else {
    body.innerHTML = items.map(i => `
      <div class="cart-item">
        ${i.product.image ? `<img src="${i.product.image}" alt="${i.product.name}">` : `<div style="width:58px;height:58px;border-radius:9px;background:#EFEDE7;"></div>`}
        <div class="ci-info">
          <div class="ci-name">${i.product.name}</div>
          <div class="ci-price">${money(i.product.price)} each</div>
          <div class="ci-row">
            <div class="qty-stepper" style="max-width:100px;">
              <button data-action="dec" data-id="${i.product.id}">−</button>
              <span>${i.qty}</span>
              <button data-action="inc" data-id="${i.product.id}">+</button>
            </div>
            <button class="remove-link" data-action="remove" data-id="${i.product.id}">Remove</button>
          </div>
        </div>
      </div>
    `).join("");

    body.querySelectorAll("[data-action]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        const action = el.dataset.action;
        if(action === "inc") cart[id].qty++;
        else if(action === "dec"){ cart[id].qty--; if(cart[id].qty<=0) delete cart[id]; }
        else if(action === "remove") delete cart[id];
        renderCartUI();
        renderGrid();
      });
    });
  }

  document.getElementById("sendWhatsapp").disabled = items.length === 0;
}

function renderAll(){
  renderCategories();
  renderGrid();
  renderCartUI();
}

/* ============================================================
   Drawer open/close
============================================================= */
function openDrawer(){
  document.getElementById("overlay").classList.add("show");
  document.getElementById("drawer").classList.add("show");
}
function closeDrawer(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
}
document.getElementById("openCartTop").addEventListener("click", openDrawer);
document.getElementById("openCartBottom").addEventListener("click", openDrawer);
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
document.getElementById("overlay").addEventListener("click", closeDrawer);

/* ============================================================
   Search
============================================================= */
document.getElementById("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  visibleCount = PAGE_SIZE;
  renderGrid();
});

document.getElementById("loadMoreBtn").addEventListener("click", () => {
  visibleCount += PAGE_SIZE;
  renderGrid();
});

/* ============================================================
   WhatsApp checkout
============================================================= */
document.getElementById("sendWhatsapp").addEventListener("click", () => {
  const name = document.getElementById("custName").value.trim();
  const location = document.getElementById("custLocation").value.trim();
  const items = Object.values(cart);
  if(!items.length) return;

  let msg = `🛍️ *New Order — GENX CHOICE ENTERPRISE*\n`;
  msg += `_Choice for every generation._\n\n`;
  msg += `*Items:*\n`;
  items.forEach((i, idx) => {
    msg += `${idx+1}. ${i.product.name}\n`;
    msg += `    Qty: ${i.qty}  ×  ${money(i.product.price)}  =  ${money(i.product.price * i.qty)}\n`;
  });
  msg += `\n*Total: ${money(cartTotal())}*\n`;
  msg += `\n———————————\n`;
  msg += `👤 *Name:* ${name || "-"}\n`;
  msg += `📍 *Location:* ${location || "-"}`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
});

/* ============================================================
   Init
============================================================= */
loadProducts();
</script>
